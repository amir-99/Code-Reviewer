services:
  frontend:
    image: ai-code-reviewer-frontend:local
    build: ./frontend
    environment:
      REVIEWER_API_URL: http://api:8080
    ports: ["8093:8080"]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
