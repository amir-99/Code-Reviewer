name: ai-code-reviewer
x-app: &app
  image: ai-code-reviewer:local
  build:
    context: .
    target: production
  env_file: .env
  read_only: true
  tmpfs: [/tmp]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  restart: unless-stopped
  volumes: [reviewer_data:/var/lib/reviewer, ./config:/app/config:ro]
services:
  postgres:
    image: postgres:16-bookworm@sha256:bb3e1a57e5407e0a5280b4211980a5e537f4abd234a87014ac979849a78dd825
    environment:
      POSTGRES_USER: reviewer
      POSTGRES_DB: reviewer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U reviewer -d reviewer"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7.4-bookworm@sha256:71da9275c5f3fcb97d0fa0c8c5b36cc995327265420f17a04bfd544f458059f7
    command: [redis-server, --appendonly, "yes"]
    volumes: [redis_data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    <<: *app
    command: [alembic, upgrade, head]
    restart: "no"
    healthcheck:
      disable: true
    depends_on:
      postgres: { condition: service_healthy }
  api:
    <<: *app
    ports: ["8092:8080"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
  worker:
    <<: *app
    command: [arq, reviewer.worker.WorkerSettings]
    healthcheck:
      test: [CMD, arq, reviewer.worker.WorkerSettings, --check]
      interval: 30s
      timeout: 5s
      start_period: 35s
      retries: 3
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
volumes:
  postgres_data:
  redis_data:
  reviewer_data:
