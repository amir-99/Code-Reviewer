# Add these locations inside the existing HTTPS server for review.blubank.ai.
# Define review_agentic_backend and review_agentic_frontend separately with the
# operator-approved reachable API and frontend addresses. Keep this native-JS
# dashboard under /agentic/; no Next.js basePath setting is needed.
location = /agentic {
    return 308 /agentic/;
}

# The trailing slash strips /agentic/api/ before forwarding to the API.
location /agentic/api/ {
    proxy_pass http://review_agentic_backend/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Prefix /agentic/api;
    proxy_set_header Origin $http_origin;
    proxy_set_header X-CSRF-Token $http_x_csrf_token;
    proxy_set_header Connection "";
    proxy_set_header Accept-Encoding "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_redirect off;
}

# Relative module and asset URLs preserve the public /agentic/ prefix.
location /agentic/ {
    proxy_pass http://review_agentic_frontend/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Prefix /agentic;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_redirect off;
}
