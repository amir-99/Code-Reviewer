# Add these locations inside the existing HTTPS server for review.blubank.ai.
# Nginx runs on the Docker host; the frontend remains bound to localhost.
location = /agentic {
    return 308 /agentic/;
}

location /agentic/ {
    # The trailing slash removes /agentic/ before forwarding.
    proxy_pass http://127.0.0.1:8093/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Connection "";

    # Live review events use SSE.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
}
