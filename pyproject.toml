[project]
name = "ai-code-reviewer"
version = "0.1.0"
description = "Deterministic GitLab code review service"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "arq>=0.26,<1",
  "sqlalchemy[asyncio]>=2.0,<2.1", "asyncpg>=0.30,<1", "alembic>=1.14,<2",
  "pydantic-settings>=2.7,<3", "httpx>=0.28,<1", "structlog>=25,<26",
  "prometheus-client>=0.21,<1", "opentelemetry-api>=1.30,<2", "beautifulsoup4>=4.13,<5", "markdownify>=1,<2", "pyyaml>=6,<7", "boto3>=1.40,<2",
  "tree-sitter>=0.25,<0.26", "tree-sitter-python>=0.25,<0.26", "tree-sitter-go>=0.25,<0.26", "tree-sitter-typescript>=0.23,<0.24",
  "opentelemetry-sdk>=1.30,<2", "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
]
[dependency-groups]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.25,<1", "pytest-socket>=0.7,<1", "aiosqlite>=0.21,<1", "ruff>=0.11,<1"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["reviewer"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--disable-socket --allow-unix-socket"
testpaths = ["tests"]
[tool.ruff]
target-version = "py312"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
